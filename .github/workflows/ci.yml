name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check
      - run: node ./src/cli.js --corpus ./tests/corpus/basic.json --strict-corpus
      - run: mkdir -p artifacts
      - run: node ./src/cli.js --diff-file ./tests/fixtures/sample.diff --changed-files src/auth/login.js --format sarif > artifacts/sample.sarif
      - run: node ./src/cli.js --diff-file ./tests/fixtures/sample.diff --changed-files src/auth/login.js --format markdown > artifacts/sample-summary.md
      - run: node ./src/cli.js --corpus ./tests/corpus/basic.json --format markdown > artifacts/corpus-report.md
      - run: npm run benchmark
      - run: cp ./benchmarks/results/baseline.json artifacts/benchmark-baseline.json
      - run: cp ./tests/fixtures/runtime-fixtures.json artifacts/runtime-fixtures.json
      - uses: actions/upload-artifact@v7
        with:
          name: security-review-artifacts
          path: artifacts/
