name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm run benchmark
      - run: npm pack
      - run: mkdir -p release-artifacts
      - run: cp ./benchmarks/results/baseline.json release-artifacts/benchmark-baseline.json
      - run: cp ./benchmarks/comparators/external-baseline.json release-artifacts/external-baseline.json
      - run: cp ./tests/fixtures/runtime-fixtures.json release-artifacts/runtime-fixtures.json
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.tgz
            release-artifacts/benchmark-baseline.json
            release-artifacts/external-baseline.json
            release-artifacts/runtime-fixtures.json
