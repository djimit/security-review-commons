name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm run benchmark
      - run: npm pack
      - run: mkdir -p release-artifacts
      - run: cp ./benchmarks/results/baseline.json release-artifacts/benchmark-baseline.json
      - run: cp ./tests/fixtures/runtime-fixtures.json release-artifacts/runtime-fixtures.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tgz
            release-artifacts/benchmark-baseline.json
            release-artifacts/runtime-fixtures.json
      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
